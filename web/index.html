<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1018">
  <title>Traffic Eye — City Operations</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1018;
      --panel: #111925;
      --panel-2: #151f2d;
      --line: #202c3a;
      --muted: #8492a6;
      --text: #edf3fb;
      --blue: #64a5ff;
      --cyan: #58d6e5;
      --green: #39d6a0;
      --amber: #f4b45d;
      --red: #ff6d79;
      --radius: 13px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -.01em;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; }
    .sidebar {
      width: 244px;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      padding: 25px 16px 18px;
      border-right: 1px solid var(--line);
      background: #0e151f;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 9px 29px; }
    .brand-mark {
      width: 37px; height: 37px; display: grid; place-items: center;
      border-radius: 11px; color: #07141a;
      background: linear-gradient(145deg, #65e1df, #5895ff);
      box-shadow: 0 7px 24px #54bfd833;
    }
    .brand-mark svg { width: 21px; height: 21px; }
    .brand-name { font-size: 15px; font-weight: 750; letter-spacing: -.03em; }
    .brand-sub { color: var(--muted); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; margin-top: 1px; }
    .nav-label { color: #68778a; padding: 0 11px; margin: 6px 0 10px; font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .nav { display: grid; gap: 5px; }
    .nav button {
      width: 100%; border: 0; background: transparent; cursor: pointer;
      border-radius: 9px; display: flex; align-items: center; gap: 12px;
      text-align: left; padding: 10px 11px; color: #9ba9ba; font-size: 12px; font-weight: 550;
      transition: .18s ease;
    }
    .nav button:hover { color: var(--text); background: #17212d; }
    .nav button.active { color: #83b8ff; background: #172a40; box-shadow: inset 2px 0 #64a5ff; }
    .nav svg { width: 17px; height: 17px; opacity: .9; }
    .nav-badge { margin-left: auto; color: #ff9aa2; background: #46252d; border-radius: 20px; padding: 1px 7px; font-size: 10px; }
    .sidebar-bottom { margin-top: auto; }
    .network-card { border: 1px solid var(--line); background: #111a26; border-radius: 11px; padding: 12px; }
    .network-title { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 650; }
    .network-detail { font-size: 10px; color: var(--muted); margin: 4px 0 11px; }
    .network-foot { display: flex; justify-content: space-between; color: #9ba9ba; font-size: 10px; }
    .online-dot { display: inline-block; width: 7px; height: 7px; background: var(--green); border-radius: 50%; margin-right: 6px; box-shadow: 0 0 10px #39d6a088; }
    .operator { display: flex; align-items: center; gap: 10px; padding: 17px 8px 0; }
    .avatar { display: grid; place-items: center; border-radius: 50%; width: 31px; height: 31px; background: #293b51; color: #b8d5ff; font-weight: 700; font-size: 11px; }
    .operator-name { font-size: 11px; font-weight: 650; }
    .operator-role { font-size: 10px; color: var(--muted); }
    .main { margin-left: 244px; min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 4; height: 61px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 0 32px; border-bottom: 1px solid var(--line);
      background: #0d141ded; backdrop-filter: blur(16px);
    }
    .crumb { color: var(--muted); font-size: 11px; }
    .crumb strong { color: #dce6f2; font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 16px; }
    .icon-button { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid transparent; background: transparent; border-radius: 8px; color: #9cabbc; cursor: pointer; }
    .icon-button:hover { background: #182330; color: white; }
    .icon-button svg { width: 17px; height: 17px; }
    .notification-dot { position: absolute; width: 6px; height: 6px; background: var(--red); border-radius: 50%; right: 6px; top: 5px; border: 1px solid var(--bg); }
    .top-divider { height: 23px; border-left: 1px solid var(--line); }
    .date-display { color: #9eabba; font-size: 11px; font-variant-numeric: tabular-nums; }
    .content { max-width: 1600px; margin: 0 auto; padding: 28px 32px 40px; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 23px; }
    .eyebrow { color: var(--cyan); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; margin-bottom: 5px; }
    h1 { font-size: 23px; line-height: 1.25; margin: 0; font-weight: 680; letter-spacing: -.035em; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .heading-actions { display: flex; align-items: center; gap: 9px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; border: 1px solid #2b394a; background: #151f2c; border-radius: 8px; color: #d7e1ed; font-size: 11px; font-weight: 600; cursor: pointer; transition: .16s; }
    .button:hover { border-color: #4b647d; background: #1a2838; }
    .button svg { width: 14px; height: 14px; }
    .button.primary { background: #367ee7; border-color: #367ee7; color: white; box-shadow: 0 5px 15px #367ee733; }
    .button.primary:hover { background: #4b8ff1; }
    .button.danger { color: #ff9ca4; border-color: #4e3038; background: #291a22; }
    .button.small { padding: 6px 9px; font-size: 10px; }
    .overview-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 18px; }
    .metric {
      min-height: 105px; position: relative; overflow: hidden;
      border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 16px;
      background: linear-gradient(130deg, #131d29, #101823);
    }
    .metric:after { content: ""; position: absolute; right: -25px; top: -36px; width: 100px; height: 100px; border-radius: 50%; background: var(--tint); opacity: .05; }
    .metric-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .metric-label { color: #a5b1c0; font-size: 11px; font-weight: 550; }
    .metric-icon { display: grid; place-items: center; width: 27px; height: 27px; border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent); border-radius: 8px; color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
    .metric-icon svg { width: 14px; height: 14px; }
    .metric-bottom { display: flex; align-items: baseline; gap: 9px; margin-top: 8px; }
    .metric-value { font-size: 25px; letter-spacing: -.045em; font-weight: 700; line-height: 1; }
    .metric-change { font-size: 10px; color: var(--green); }
    .metric-note { color: #7f8da0; font-size: 10px; margin-top: 6px; }
    .live-layout { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(260px, .8fr); gap: 15px; align-items: stretch; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .panel-title { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 12px; }
    .panel-title svg { width: 15px; height: 15px; color: var(--cyan); }
    .panel-subtitle { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .camera-select { border: 1px solid #293748; border-radius: 7px; background: #111a25; padding: 6px 27px 6px 9px; color: #d2dce9; font-size: 10px; outline: none; max-width: 220px; }
    .video { min-height: 315px; height: clamp(315px, 31vw, 440px); position: relative; overflow: hidden; background: #081019; }
    .video:before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #07101926 0%, #08111a08 42%, #06101bd9 100%); z-index: 1; pointer-events: none; }
    .video-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.7) saturate(.8); transition: filter .35s, transform 8s linear; }
    .video.streaming .video-image { filter: brightness(.82) saturate(.9); transform: scale(1.035); }
    .video.paused .video-image { filter: brightness(.58) grayscale(.38); }
    .video-grid { position: absolute; inset: 12% 16% 7%; z-index: 2; opacity: .45; background: linear-gradient(110deg, transparent 39.5%, #59d6e533 39.8%, transparent 40.2%), linear-gradient(70deg, transparent 59.5%, #59d6e533 59.8%, transparent 60.2%); }
    .video-top { position: absolute; z-index: 3; top: 14px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-start; }
    .live-tag, .video-code { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #ffffff20; background: #06101bb8; backdrop-filter: blur(8px); border-radius: 5px; padding: 5px 8px; font-size: 9px; font-weight: 700; letter-spacing: .08em; }
    .live-tag { color: #ff9ca4; }
    .live-tag .online-dot { width: 6px; height: 6px; background: var(--red); box-shadow: 0 0 8px #ff6d79; }
    .video-code { color: #e5edf6; font-weight: 500; letter-spacing: .04em; }
    .track { position: absolute; z-index: 2; border: 1px solid var(--cyan); width: 8%; height: 17%; left: 30%; top: 44%; border-radius: 2px; opacity: .8; }
    .track:before { content: "CAR · 98%"; position: absolute; left: -1px; top: -17px; padding: 2px 4px; white-space: nowrap; color: #041319; background: var(--cyan); font-size: 8px; font-weight: 700; }
    .track.t2 { width: 10%; height: 20%; left: 61%; top: 48%; border-color: var(--red); }
    .track.t2:before { content: "SPEED · 108 km/h"; color: #fff; background: #d64256; }
    .track.t3 { width: 6%; height: 13%; left: 48%; top: 35%; }
    .track.t3:before { content: "AUTO · 95%"; }
    .video-bottom { position: absolute; z-index: 3; bottom: 13px; left: 14px; right: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .feed-info { color: #eaf2fa; font-size: 11px; font-weight: 650; }
    .feed-location { color: #bcc8d5; font-weight: 400; font-size: 9px; margin-top: 2px; }
    .video-controls { display: flex; gap: 6px; }
    .video-controls .button { background: #07111dcf; backdrop-filter: blur(6px); border-color: #ffffff30; padding: 7px 9px; font-size: 10px; }
    .video-controls .button:hover { background: #142334ed; }
    .stream-stats { display: flex; gap: 18px; padding: 10px 14px; border-top: 1px solid var(--line); color: #8796a8; font-size: 9px; }
    .stream-stats strong { color: #dbe5ef; font-weight: 600; margin-left: 4px; }
    .side-stack { display: grid; grid-template-rows: auto 1fr; gap: 15px; }
    .signal-card { padding-bottom: 13px; }
    .signal-body { padding: 14px 16px 4px; }
    .junction { color: #e6eef8; font-weight: 600; font-size: 11px; }
    .junction-sub { color: var(--muted); font-size: 9px; margin-top: 2px; }
    .phase-row { display: flex; align-items: center; gap: 12px; margin-top: 15px; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: #0e1620; }
    .signal-light { display: flex; gap: 4px; padding: 5px; background: #202a36; border-radius: 20px; }
    .lamp { width: 9px; height: 9px; border-radius: 50%; background: #34404d; }
    .lamp.green.active { background: var(--green); box-shadow: 0 0 10px #39d6a088; }
    .lamp.red.active { background: var(--red); box-shadow: 0 0 10px #ff6d7988; }
    .lamp.amber.active { background: var(--amber); box-shadow: 0 0 10px #f4b45d88; }
    .phase-label { font-size: 10px; font-weight: 600; }
    .phase-caption { font-size: 9px; color: var(--muted); margin-top: 2px; }
    .countdown { margin-left: auto; color: var(--green); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .emergency-button { width: 100%; margin-top: 10px; padding: 8px 10px; }
    .emergency-button.active { border-color: #6b3739; background: #3b2027; color: #ff939b; }
    .activity-list { padding: 2px 15px 8px; }
    .activity-item { display: grid; grid-template-columns: 27px 1fr auto; gap: 9px; align-items: center; padding: 10px 0; border-bottom: 1px solid #1b2632; }
    .activity-item:last-child { border-bottom: 0; }
    .activity-icon { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 8px; color: var(--red); background: #39222a; }
    .activity-icon.blue { color: var(--blue); background: #1c2e45; }
    .activity-icon svg { width: 13px; height: 13px; }
    .activity-title { font-size: 10px; color: #dbe4ee; font-weight: 600; }
    .activity-meta { color: var(--muted); font-size: 9px; margin-top: 2px; }
    .activity-time { color: #8290a1; font-size: 9px; align-self: start; padding-top: 3px; }
    .lower-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(270px, .85fr); gap: 15px; margin-top: 15px; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; white-space: nowrap; }
    th { text-align: left; font-size: 9px; color: #7f8ea0; font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .08em; }
    td { padding: 11px 14px; border-bottom: 1px solid #1b2531; font-size: 10px; color: #bdc9d7; }
    tbody tr:last-child td { border-bottom: 0; }
    .plate { color: #e6edf5; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: 650; letter-spacing: .025em; }
    .type-pill, .status-pill { display: inline-block; border-radius: 20px; padding: 3px 7px; font-size: 9px; font-weight: 600; }
    .type-pill.speed { background: #41262b; color: #ff939b; }
    .type-pill.signal { background: #433423; color: #f5c077; }
    .type-pill.helmet { background: #223542; color: #82cbe3; }
    .type-pill.wrong { background: #302b4a; color: #b8aaff; }
    .status-pill.pending { color: #f1bc6a; background: #3a3021; }
    .status-pill.issued { color: #84c6ff; background: #203247; }
    .status-pill.paid { color: #72dab5; background: #1d382f; }
    .status-pill.flagged { color: #ff969e; background: #402329; }
    .table-action { border: 0; background: transparent; color: #91bfff; cursor: pointer; font-size: 10px; padding: 4px; }
    .table-action:hover { color: white; }
    .view-all { color: #8bbcff; font-size: 10px; text-decoration: none; cursor: pointer; }
    .view-all:hover { color: white; }
    .density { padding: 15px 16px 16px; }
    .density-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .density-title { font-size: 11px; font-weight: 650; }
    .density-sub { color: var(--muted); font-size: 9px; margin-top: 3px; }
    .density-value { color: var(--amber); font-size: 10px; font-weight: 650; }
    .density-number { font-size: 24px; font-weight: 700; margin-top: 16px; }
    .density-number small { color: var(--muted); font-size: 10px; font-weight: 500; }
    .bar-chart { display: flex; align-items: end; gap: 7px; height: 54px; border-bottom: 1px solid #283342; margin: 8px 0 9px; }
    .bar-chart i { flex: 1; display: block; min-height: 5px; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, #60c6d7, #3375b8); opacity: .8; }
    .chart-labels { display: flex; justify-content: space-between; color: #758397; font-size: 8px; }
    .density-footer { display: flex; justify-content: space-between; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); font-size: 9px; color: var(--muted); }
    .density-footer strong { color: #dce6f1; font-weight: 600; }
    .subpage { display: none; }
    .subpage.active { display: block; }
    .subpage .panel { margin-bottom: 14px; }
    .summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 15px; }
    .summary-box { padding: 14px 16px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); }
    .summary-box span { display: block; color: var(--muted); font-size: 10px; }
    .summary-box strong { display: block; font-size: 21px; margin-top: 4px; }
    .filters { display: flex; gap: 7px; padding: 12px 14px; overflow-x: auto; }
    .filter-chip { white-space: nowrap; border-radius: 20px; padding: 6px 10px; border: 1px solid #293647; background: #111b27; color: #9ba9ba; font-size: 10px; cursor: pointer; }
    .filter-chip.active { color: #9ac6ff; background: #1b3048; border-color: #365879; }
    .search { width: min(350px, 100%); border: 1px solid #293647; border-radius: 8px; background: #0e1620; color: var(--text); outline: none; padding: 9px 11px; font-size: 11px; }
    .search:focus { border-color: #4c88ca; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
    .toolbar p { color: var(--muted); font-size: 10px; margin: 0; }
    .signal-page-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 15px; }
    .signal-map { min-height: 280px; margin: 15px; display: grid; place-items: center; border: 1px solid #273646; border-radius: 10px; background: radial-gradient(ellipse at center, #1a2a34, #101a24 68%); position: relative; }
    .road-h, .road-v { position: absolute; background: #283541; }
    .road-h { height: 48px; width: 100%; top: calc(50% - 24px); border-top: 1px dashed #596878; border-bottom: 1px dashed #596878; }
    .road-v { width: 48px; height: 100%; left: calc(50% - 24px); border-left: 1px dashed #596878; border-right: 1px dashed #596878; }
    .intersection { z-index: 1; width: 93px; height: 93px; border: 1px solid #ffffff22; border-radius: 7px; background: #17232b; display: grid; place-items: center; }
    .intersection .signal-light { transform: rotate(90deg); }
    .corridor-panel { padding: 16px; }
    .corridor-panel h3 { margin: 0; font-size: 13px; }
    .corridor-panel p { color: var(--muted); font-size: 10px; line-height: 1.6; }
    .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .settings-card { padding: 17px; }
    .settings-card h3 { margin: 0 0 5px; font-size: 12px; }
    .settings-card p { color: var(--muted); font-size: 10px; margin: 0; line-height: 1.7; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding: 12px 0; font-size: 10px; color: #c4cfdb; }
    .setting-row:first-of-type { margin-top: 10px; }
    .switch { width: 31px; height: 17px; border: 0; border-radius: 20px; background: #394657; position: relative; cursor: pointer; }
    .switch:after { content: ""; position: absolute; width: 11px; height: 11px; border-radius: 50%; background: white; left: 3px; top: 3px; transition: transform .18s; }
    .switch.on { background: #3985eb; }
    .switch.on:after { transform: translateX(14px); }
    .toast { position: fixed; z-index: 10; right: 22px; bottom: 22px; border: 1px solid #33485c; border-radius: 9px; background: #172432; color: #e5eef8; padding: 11px 15px; font-size: 11px; box-shadow: 0 10px 35px #0008; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .modal-backdrop { position: fixed; z-index: 9; inset: 0; display: none; place-items: center; padding: 20px; background: #03070bc9; backdrop-filter: blur(5px); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(460px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; border: 1px solid #2b3b4d; border-radius: 13px; background: #121c28; padding: 20px; box-shadow: 0 20px 70px #0009; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; }
    .modal h2 { margin: 0; font-size: 15px; }
    .modal p { color: var(--muted); font-size: 11px; }
    .snapshot-image { width: 100%; border-radius: 8px; border: 1px solid #314253; display: block; }
    .mobile-menu { display: none; }
    @media (max-width: 1100px) {
      .sidebar { width: 210px; }
      .main { margin-left: 210px; }
      .content { padding: 24px 22px 34px; }
      .topbar { padding: 0 22px; }
      .overview-strip { gap: 9px; }
      .metric { padding: 13px; }
      .live-layout { grid-template-columns: minmax(0, 1.5fr) minmax(245px, .85fr); }
    }
    @media (max-width: 820px) {
      .sidebar { width: 62px; padding: 17px 9px; }
      .brand { padding: 0 3px 25px; }
      .brand-copy, .nav-label, .nav button .nav-text, .nav-badge, .network-card, .operator-copy { display: none; }
      .nav { gap: 8px; }
      .nav button { justify-content: center; padding: 11px 0; }
      .nav svg { width: 19px; height: 19px; }
      .operator { justify-content: center; padding: 14px 0 0; }
      .main { margin-left: 62px; }
      .live-layout { grid-template-columns: 1fr; }
      .side-stack { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
      .lower-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 580px) {
      .topbar { height: 54px; padding: 0 14px; }
      .crumb { font-size: 10px; }
      .date-display { display: none; }
      .top-actions { gap: 8px; }
      .content { padding: 22px 13px 30px; }
      .page-heading { margin-bottom: 17px; }
      h1 { font-size: 19px; }
      .subtitle { max-width: 300px; font-size: 10px; }
      .heading-actions .button:not(.primary) { display: none; }

        <div class="settings-grid"><section class="panel settings-card"><h3>Monitoring preferences</h3><p>Configure how your city network detects and reports incidents.</p>
          <div class="setting-row"><span>Real-time camera analysis</span><button class="switch on" data-action="setting"></button></div>
          <div class="setting-row"><span>Automatic plate recognition</span><button class="switch on" data-action="setting"></button></div>
          <div class="setting-row"><span>Violation alert notifications</span><button class="switch on" data-action="setting"></button></div>
          <div class="setting-row"><span>Night mode enhancement</span><button class="switch" data-action="setting"></button></div></section>
          <section class="panel settings-card"><h3>System health</h3><p>Current operational status for connected monitoring services.</p>
            <div class="setting-row"><span>Camera network</span><strong style="color:var(--green)">All 4 online</strong></div><div class="setting-row"><span>AI detection engine</span><strong style="color:var(--green)">Operational</strong></div><div class="setting-row"><span>ANPR database sync</span><strong style="color:var(--green)">Synced just now</strong></div><div class="setting-row"><span>Last system check</span><strong id="healthTime">${timestamp()}</strong></div></section></div>`;
    }
    const renderers = {overview:overviewPage,violations:violationsPage,plates:platesPage,signals:signalsPage,settings:settingsPage};
    let activePage = "overview";
    function render(page = activePage) {
      activePage = page;
      Object.keys(renderers).forEach(key=>{
        document.getElementById(`page-${key}`).classList.toggle("active",key===page);
        document.querySelector(`.nav button[data-page="${key}"]`).classList.toggle("active",key===page);
      });
      document.getElementById(`page-${page}`).innerHTML = renderers[page]();
      document.getElementById("crumbTitle").textContent = titles[page];
      document.getElementById("navViolationCount").textContent = String(violations.filter(v=>v.statusCls==="pending").length).padStart(2,"0");
    }
    let toastTimer;
    function toast(message) {
      const el = document.getElementById("toast"); el.textContent = message; el.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"),2500);
    }
    function saveCsv() {
      const rows = [["Time","Plate","Violation","Camera","Speed","Fine","Status"],...violations.map(v=>[v.time,v.plate,v.type,v.camera,v.speed,v.fine,v.status])];
      const csv = rows.map(row=>row.map(cell=>`"${String(cell).replaceAll('"','""')}"`).join(",")).join("\r\n");
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"})); link.download = "traffic-violations.csv"; link.click();
      URL.revokeObjectURL(link.href); toast("Report exported as CSV");
    }
    document.addEventListener("click", event => {
      const nav = event.target.closest("[data-page]");
      if (nav) { render(nav.dataset.page); return; }
      const goto = event.target.closest("[data-goto]");
      if (goto) { render(goto.dataset.goto); return; }
      const filter = event.target.closest("[data-filter]");
      if (filter) { violationFilter = filter.dataset.filter; render("violations"); return; }
      const action = event.target.closest("[data-action]");
      if (!action) return;
      switch (action.dataset.action) {
        case "stream": streaming = !streaming; render("overview"); toast(streaming?"Camera stream resumed":"Camera stream paused"); break;
        case "snapshot":
          document.getElementById("snapshotCaption").textContent = `${selectedCamera.name} · ${timestamp()} · 5 vehicles detected`;
          document.getElementById("snapshotModal").classList.add("open"); break;
        case "emergency":
          emergency = !emergency; render(activePage); toast(emergency?"Emergency green corridor activated":"Emergency corridor deactivated"); break;
        case "challan": {
          const record = violations.find(v=>v.id===action.dataset.id);
          if (record && record.statusCls==="pending") { record.status="Challan Issued"; record.statusCls="issued"; totalViolations++; render(activePage); toast(`E-challan issued for ${record.plate}`); }
          else toast(`Opening ${record?.id || "violation"} record`); break;
        }
        case "plate": toast(`Vehicle registry record · ${action.dataset.plate}`); break;
        case "export": saveCsv(); break;
        case "add-camera": toast("All 4 city camera feeds are connected"); break;
        case "setting": action.classList.toggle("on"); toast("Preference updated"); break;
      }
    });
    document.addEventListener("change",event=>{
      if(event.target.id==="cameraSelect") { selectedCamera=cameras.find(c=>c.id===event.target.value)||cameras[0]; render("overview"); }
    });
    document.addEventListener("input",event=>{
      if(event.target.id==="plateSearch") {
        const position=event.target.selectionStart; plateSearch=event.target.value; render("plates");
        const input=document.getElementById("plateSearch"); input.focus(); input.setSelectionRange(position,position);
      }
    });
    function closeModal(){ document.getElementById("snapshotModal").classList.remove("open"); }
    document.getElementById("closeModal").addEventListener("click",closeModal);
    document.getElementById("doneModal").addEventListener("click",closeModal);
    document.getElementById("snapshotModal").addEventListener("click",e=>{if(e.target.id==="snapshotModal")closeModal();});
    document.getElementById("alertButton").addEventListener("click",()=>{render("violations");toast("Showing incidents that need attention");});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
    function updateClock() {
      const now = new Date();
      document.getElementById("topDate").textContent = now.toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric"})+" · "+now.toLocaleTimeString("en-GB",{hour12:false});
      const counter=document.getElementById("signalCount"), large=document.getElementById("signalCountLarge"), phase=document.getElementById("phaseTimer");
      if(streaming && !emergency) signalSeconds=signalSeconds<=1?30:signalSeconds-1;
      [counter,large].filter(Boolean).forEach(el=>el.textContent=signalSeconds);
      if(phase)phase.textContent=`${signalSeconds}s`;
    }
    render(); updateClock(); setInterval(updateClock,1000);
    setInterval(()=>{ if(streaming){ vehicleCount++; totalPlates++; } },12000);
  </script>
</body>
</html>
